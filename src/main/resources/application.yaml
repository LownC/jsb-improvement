spring:
  output:
    ansi:
      enabled: always
  application:
    name: sbb
  profiles:
    active: dev
  # 강사 14168 41강: 폼의 _method 파라미터로 PUT/DELETE 요청을 표현할 수 있게 한다.
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE