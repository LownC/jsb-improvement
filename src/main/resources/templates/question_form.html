<html layout:decorate="~{layout}">
<head>
    <title th:text="${modifying} ? '질문 수정' : '질문 등록'"></title>
</head>
<div layout:fragment="content" class="container">
    <h5 class="my-3 border-bottom pb-2" th:text="${modifying} ? '질문 수정' : '질문 등록'"></h5>
    <!--
      th:action 값을 비우면 현재 URL로 전송된다. (강사 14168 5강)
      수정일 때는 th:method="put" 이 method="post" + 숨은 _method=put 으로 렌더링된다. (강사 14168 41강)
    -->
    <form th:action th:object="${form}" th:method="${modifying} ? 'put' : 'post'">
        <div th:replace="~{form_errors :: formErrorsFragment}"></div>
        <div class="mb-3">
            <label for="subject" class="form-label">제목</label>
            <input type="text" th:field="*{subject}" class="form-control" autofocus>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea th:field="*{content}" class="form-control" rows="10"></textarea>
        </div>
        <input type="submit" value="저장하기" class="btn btn-primary my-2">
    </form>
</div>
</html>
