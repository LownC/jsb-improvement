<html layout:decorate="~{layout}">
<head>
    <title>답변 수정</title>
</head>
<div layout:fragment="content" class="container">
    <h5 class="my-3 border-bottom pb-2">답변 수정</h5>
    <!-- 현재 URL(/answer/modify/{id})로 PUT 전송 (th:method="put" → method="post" + _method=put) -->
    <form th:action th:object="${form}" th:method="put">
        <div th:replace="~{form_errors :: formErrorsFragment}"></div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea th:field="*{content}" class="form-control" rows="10" autofocus></textarea>
        </div>
        <input type="submit" value="수정하기" class="btn btn-primary my-2">
    </form>
</div>
</html>
